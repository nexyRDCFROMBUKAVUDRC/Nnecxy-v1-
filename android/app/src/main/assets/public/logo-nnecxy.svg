<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Cyan & Blue Glow Filters -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#0044CC" />
    </linearGradient>

    <linearGradient id="cyanRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#0044AA" />
    </linearGradient>

    <radialGradient id="innerDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#051833" />
      <stop offset="70%" stop-color="#020B18" />
      <stop offset="100%" stop-color="#000206" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" fill="#000000" rx="40" />

  <!-- Outermost Tech Ring Elements -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3 9" opacity="0.45" />
  <circle cx="250" cy="250" r="205" fill="none" stroke="#00B4D8" stroke-width="2" stroke-dasharray="24 16 8 16" opacity="0.6" />
  
  <!-- Outer glowing cyber ring -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#cyberBlue)" stroke-width="5" filter="url(#cyanGlow)" />
  <circle cx="250" cy="250" r="195" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8" />

  <!-- Digital tick marks & segmented arcs -->
  <!-- Top arc dash -->
  <path d="M 120 180 A 185 185 0 0 1 380 180" fill="none" stroke="#00E5FF" stroke-width="3.5" stroke-dasharray="14 10 30 10 6 10" opacity="0.9" />
  <!-- Bottom arc dash -->
  <path d="M 115 315 A 185 185 0 0 0 320 380" fill="none" stroke="#0088FF" stroke-width="3.5" stroke-dasharray="20 12 10 12" opacity="0.85" />
  
  <!-- Outer dotted track -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.75" />

  <!-- Tech HUD notches on sides -->
  <path d="M 85 240 L 95 240 M 85 250 L 100 250 M 85 260 L 95 260" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
  <path d="M 405 240 L 415 240 M 400 250 L 415 250 M 405 260 L 415 260" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />

  <!-- Mid Concentric Glow Track -->
  <circle cx="250" cy="250" r="162" fill="none" stroke="#00E5FF" stroke-width="3.5" filter="url(#softGlow)" />
  <circle cx="250" cy="250" r="150" fill="none" stroke="#0055FF" stroke-width="8" opacity="0.35" />

  <!-- Inner Tech Disk -->
  <circle cx="250" cy="250" r="142" fill="url(#innerDisc)" stroke="#00E5FF" stroke-width="2" />
  
  <!-- Inner fine rings -->
  <circle cx="250" cy="250" r="130" fill="none" stroke="#0088FF" stroke-width="1.5" stroke-dasharray="16 8" opacity="0.5" />
  <circle cx="250" cy="250" r="120" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.3" />

  <!-- Central Letter 'N' -->
  <text x="250" y="292" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="130" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle"
        letter-spacing="-2">N</text>

  <!-- Official Cyan Chat Speech Bubble in bottom-right corner -->
  <g transform="translate(305, 305)" filter="url(#cyanGlow)">
    <!-- Speech bubble body -->
    <path d="M 75 0 
             C 116 0 150 33 150 74 
             C 150 115 116 148 75 148 
             C 62 148 50 145 39 139 
             L 5 152 
             L 19 119 
             C 7 107 0 91 0 74 
             C 0 33 34 0 75 0 Z" 
          fill="#00E5FF" />
  </g>
</svg>
